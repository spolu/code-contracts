name: Review bot
run-name: >-
  ${{ github.event_name == 'workflow_dispatch' && format('Contract review #{0}', inputs.pull-request-number) || 'Review request' }}

on:
  pull_request:
    types: [opened, edited]
  issue_comment:
    types: [created, edited]
  workflow_dispatch:
    inputs:
      pull-request-number:
        description: PR to review; select its head branch when dispatching manually.
        required: true
        type: string
      request-run-id:
        description: Original request run ID when dispatched by the review bot.
        required: false
        type: string

permissions:
  contents: read

jobs:
  request:
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      actions: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - id: request
        uses: ./.github/actions/review-bot
        with:
          review-workflow: review-bot.yml

  review:
    name: Review execution
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      actions: read
      statuses: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - uses: ./.github/actions/contract-review
        with:
          pull-request-number: ${{ inputs.pull-request-number }}
          request-run-id: ${{ inputs.request-run-id }}
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
