name: Contract review

on:
  pull_request:
    types: [opened, edited]
  issue_comment:
    types: [created, edited]

permissions:
  contents: read

jobs:
  request:
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      request: ${{ steps.request.outputs.request }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Validate review request
        id: request
        uses: actions/github-script@v7
        with:
          script: |
            const { resolveReviewRequest } = require('./.github/codex/review-request.cjs');
            const request = await resolveReviewRequest({ github, context, core });
            if (request) core.setOutput('request', JSON.stringify(request));

  review:
    needs: request
    if: needs.request.outputs.request != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      review: ${{ steps.codex.outputs.final-message }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - uses: actions/checkout@v5
        with:
          ref: ${{ fromJSON(needs.request.outputs.request).head_sha }}
          path: source
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: source/cc-check/.nvmrc
          cache: npm
          cache-dependency-path: source/cc-check/package-lock.json

      - name: Build contract discovery tools
        working-directory: source
        run: |
          npm ci --prefix cc-check
          npm run build --prefix cc-check
          node --test ../.github/codex/publish-review.test.cjs ../.github/codex/review-request.test.cjs

      - name: Prepare review context
        uses: actions/github-script@v7
        env:
          REVIEW_REQUEST: ${{ needs.request.outputs.request }}
        with:
          script: |
            const { execFileSync } = require('node:child_process');
            const { mkdirSync, writeFileSync } = require('node:fs');
            const request = JSON.parse(process.env.REVIEW_REQUEST);
            const params = { ...context.repo, pull_number: request.pull_number, per_page: 100 };
            const [files, comments, reviews] = await Promise.all([
              github.paginate(github.rest.pulls.listFiles, params),
              github.paginate(github.rest.pulls.listReviewComments, params),
              github.paginate(github.rest.pulls.listReviews, params),
            ]);
            mkdirSync('source/.github/codex', { recursive: true });
            writeFileSync('source/.github/codex/review-context.json', JSON.stringify({
              ...request,
              merge_base: execFileSync('git', ['merge-base', request.base_sha, request.head_sha], { cwd: 'source', encoding: 'utf8' }).trim(),
              files,
              comments,
              reviews,
              validation: [
                { command: 'npm ci --prefix cc-check', status: 'passed' },
                { command: 'npm run build --prefix cc-check', status: 'passed' },
                { command: 'node --test ../.github/codex/publish-review.test.cjs ../.github/codex/review-request.test.cjs', status: 'passed' },
              ],
            }));

      - name: Create unprivileged review user
        run: |
          sudo adduser --system --home /home/codex-review --shell /bin/bash --group codex-review
          sudo usermod -a -G runner codex-review
          sudo chmod 755 /home/codex-review
          sudo chgrp -R codex-review "$GITHUB_WORKSPACE"
          sudo chmod -R g+rX "$GITHUB_WORKSPACE"
          sudo -u codex-review test -r "$GITHUB_WORKSPACE/source/.github/codex/review-context.json"

      - name: Review contracts with Codex
        id: codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          model: gpt-5.6-luna
          effort: xhigh
          working-directory: ${{ github.workspace }}/source
          prompt-file: ${{ github.workspace }}/.github/codex/review.md
          sandbox: read-only
          # drop-sudo can break runner DNS: https://github.com/openai/codex-action/issues/160
          safety-strategy: unprivileged-user
          codex-user: codex-review
          codex-args: '["--output-schema", "${{ github.workspace }}/.github/codex/review-schema.json"]'

  publish:
    needs: [request, review]
    if: needs.review.outputs.review != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - uses: actions/checkout@v5
        with:
          ref: ${{ fromJSON(needs.request.outputs.request).head_sha }}
          path: source
          fetch-depth: 0
          persist-credentials: false

      - name: Submit comment review
        uses: actions/github-script@v7
        env:
          REVIEW_REQUEST: ${{ needs.request.outputs.request }}
          CONTRACT_REVIEW: ${{ needs.review.outputs.review }}
        with:
          script: |
            const { publishReview } = require('./.github/codex/publish-review.cjs');
            process.chdir('source');
            await publishReview({ github, context, core, request: JSON.parse(process.env.REVIEW_REQUEST), review: JSON.parse(process.env.CONTRACT_REVIEW) });
